  <path fill="url(#w1)" opacity=".5"><animate attributeName="d" dur="9s" repeatCount="indefinite" values="M0 130 C 200 90, 400 170, 600 130 S 1000 168, 1200 130 V200 H0 Z;M0 150 C 200 110, 400 190, 600 150 S 1000 118, 1200 160 V200 H0 Z;M0 130 C 200 90, 400 170, 600 130 S 1000 168, 1200 130 V200 H0 Z"/></path>
