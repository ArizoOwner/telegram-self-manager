        <g><circle r="22" fill="#0b0e17" stroke="#ffffff30"/><rect x="-8" y="-2" width="16" height="12" rx="3" fill="#86efac"/><path d="M-4.6 -2V-5a4.6 4.6 0 0 1 9.2 0V-2" fill="none" stroke="#86efac" stroke-width="2.4"/><circle cy="4" r="1.8" fill="#0b0e17"/>
