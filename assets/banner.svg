<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Arizo Telegram Self Manager">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0d18"/><stop offset=".5" stop-color="#111827"/><stop offset="1" stop-color="#181336"/></linearGradient>
  <linearGradient id="title" gradientUnits="userSpaceOnUse" x1="380" y1="0" x2="780" y2="0" spreadMethod="reflect">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#e9d5ff"/><stop offset=".75" stop-color="#a855f7"/><stop offset="1" stop-color="#38bdf8"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="-400 0" to="400 0" dur="7s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
  <clipPath id="clip"><rect width="1200" height="340" rx="30"/></clipPath>
</defs>
<style>
  text{font-family:'Segoe UI','Inter',system-ui,-apple-system,Arial,sans-serif}
  .tw{animation:tw 4s ease-in-out infinite}
  @keyframes tw{0%,100%{opacity:.12}50%{opacity:.95}}
  .spark{transform-box:fill-box;transform-origin:center;animation:spark 3s ease-in-out infinite}
  @keyframes spark{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
  .bob{animation:bob 5s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle r="230" fill="#8b5cf6" opacity=".5" filter="url(#glow)"><animate attributeName="cx" values="150;330;150" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="300;200;300" dur="12s" repeatCount="indefinite"/></circle>
  <circle r="220" fill="#0ea5e9" opacity=".4" filter="url(#glow)"><animate attributeName="cx" values="1090;900;1090" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="30;150;30" dur="14s" repeatCount="indefinite"/></circle>
