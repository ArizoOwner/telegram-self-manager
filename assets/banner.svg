  </g>

  <!-- profile clock pill -->
  <g transform="translate(850 38)">
    <rect width="290" height="42" rx="21" fill="#0b0e17" stroke="#ffffff22"/>
    <circle cx="24" cy="21" r="5" fill="#22c55e"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
