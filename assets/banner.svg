    <g transform="translate(106 21)" fill="#38bdf8"><circle r="9" fill="none" stroke="#38bdf8" stroke-width="2.2"/><path d="M0 -5 V0" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/></path><path d="M0 0 L4 2" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round"/></g>
    <g font-size="15" font-weight="700" font-family="ui-monospace,'Cascadia Code',Consolas,Menlo,monospace" fill="#38bdf8"><g opacity="1"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.16666666666666666;1" values="1;0;0"/><text x="128" y="26.5">12:41</text></g><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.16666666666666666;0.3333333333333333;1" values="0;1;0;0"/><text x="128" y="26.5">12:42</text></g><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.3333333333333333;0.5;1" values="0;1;0;0"/><text x="128" y="26.5">12:43</text></g><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.6666666666666666;1" values="0;1;0;0"/><text x="128" y="26.5">12:44</text></g><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6666666666666666;0.8333333333333334;1" values="0;1;0;0"/><text x="128" y="26.5">12:45</text></g><g opacity="0"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.8333333333333334;1" values="0;1;1"/><text x="128" y="26.5">12:46</text></g></g>
    <text x="206" y="26" font-size="11" fill="#7c8397" letter-spacing="1">LIVE 24/7</text>
  </g>

  <!-- titles -->
  <text x="380" y="168" font-size="82" font-weight="800" fill="url(#title)" letter-spacing="1">Arizo Self</text>
  <text x="384" y="208" font-size="22" font-weight="600" fill="#c4b5fd" letter-spacing="7">TELEGRAM SELF MANAGER</text>
  <g font-size="21" fill="#cbd5e1"><g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;1" values="1;0;0"/><text x="384" y="252">Atomic clock · sub-40ms MTProto precision</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;0.5;1" values="0;1;0;0"/><text x="384" y="252">Ghost mode · silent read receipts</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.5;0.75;1" values="0;1;0;0"/><text x="384" y="252">Google 2FA · zero-trust honeypot</text></g><g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.75;1" values="0;1;1"/><text x="384" y="252">Anti-delete · anti-edit · view-once saver</text></g></g>
  <text x="384" y="292" font-size="19" fill="#8b86c9" style="font-family:Vazirmatn,Tahoma,'Segoe UI',sans-serif" direction="rtl" text-anchor="end">سلف‌بات هوشمند تلگرام روی کلادفلر</text>
